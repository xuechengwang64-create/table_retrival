table_name: SlotSummary
business_name_cn: Slot Performance Summary
description_cn: Aggregated wide table of slot KPI metrics, aggregated by hour/day granularity for slot performance trend analysis and anomaly detection.
columns:
  - name: slot_id
    business_name: Slot ID
    type: varchar(64)
  - name: avg_temperature
    business_name: Average Temperature
    type: decimal(5,2)
  - name: max_temperature
    business_name: Peak Temperature
    type: decimal(5,2)
  - name: stat_time
    business_name: Statistics Time
    type: datetime
