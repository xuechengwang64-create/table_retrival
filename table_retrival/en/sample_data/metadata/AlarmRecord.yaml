table_name: AlarmRecord
business_name_cn: Alarm Record
description_cn: Records alarm information generated by network devices and storage devices, including alarm severity, alarm type, alarm content, occurrence time, and recovery time.
columns:
  - name: alarm_id
    business_name: Alarm ID
    type: varchar(64)
  - name: device_id
    business_name: Associated Device ID
    type: varchar(64)
  - name: alarm_level
    business_name: Alarm Severity
    type: varchar(16)
  - name: alarm_type
    business_name: Alarm Type
    type: varchar(32)
  - name: alarm_content
    business_name: Alarm Content
    type: text
  - name: occur_time
    business_name: Occurrence Time
    type: datetime
